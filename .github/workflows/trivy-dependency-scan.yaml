name: Trivy Image Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly on Mondays at 06:00 UTC

jobs:
  trivy-scan:
    name: Scan Docker Images with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Trivy
        # https://github.com/aquasecurity/trivy-action/releases
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25

      - name: Extract images from docker-compose.yml
        id: extract
        run: |
          mkdir -p trivy-reports
          yq -r '.services[] | select(.image | contains("gatus")).image' docker-compose.yml > images.txt
          echo "Found images:"
          cat images.txt

      - name: Run Trivy scan for each image
        id: scan
        continue-on-error: true
        run: |
          failed=false
          while read -r image; do
            if [ -z "$image" ]; then
              continue
            fi
            safe_name=$(echo "$image" | tr '/:' '__')
            echo "Scanning image: $image"
            trivy image --exit-code 0 --format json -o "trivy-reports/${safe_name}.json" "$image"
            trivy image --exit-code 1 --severity HIGH,CRITICAL "$image" || failed=true
          done < images.txt
          echo "FAILED=$failed" >> $GITHUB_ENV

      - name: Upload Trivy scan reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-reports
          path: trivy-reports/

      - name: Fail workflow if high/critical vulnerabilities found
        if: env.FAILED == 'true'
        run: |
          echo "High/Critical vulnerabilities found!"
          exit 1
